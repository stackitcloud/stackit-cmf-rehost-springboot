---
- name: Rehost Spring Boot service on STACKIT VM
  hosts: rehost
  become: true
  gather_facts: false
  vars:
    app_user: spring
    app_group: spring
    app_dir: /opt/springboot
    app_jar: /opt/springboot/app.jar

  pre_tasks:
    - name: Wait for SSH to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Gather facts after SSH is ready
      ansible.builtin.setup:

  tasks:
    - name: Install runtime packages
      ansible.builtin.apt:
        name:
          - openjdk-17-jre-headless
          - curl
        update_cache: true
        state: present

    - name: Install node exporter package
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
        state: present
      when: enable_node_exporter | default(false) | bool

    - name: Install stress package for local load profile
      ansible.builtin.apt:
        name:
          - stress-ng
        state: present
      when: enable_local_load_generator | default(false) | bool

    - name: Ensure textfile collector directory exists
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: enable_node_exporter | default(false) | bool

    - name: Configure node exporter textfile collector
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        owner: root
        group: root
        mode: "0644"
        content: |
          ARGS="--web.listen-address=:{{ node_exporter_port | default(9100) }} --collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
      when: enable_node_exporter | default(false) | bool

    - name: Install Spring Boot health metric script
      ansible.builtin.copy:
        dest: /usr/local/bin/springboot-health-metrics.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          METRICS_DIR="/var/lib/node_exporter/textfile_collector"
          METRICS_FILE="$METRICS_DIR/springboot_health.prom"

          status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:{{ springboot_app_port | default(8080) }}/" || true)

          if [[ "$status" =~ ^[23] ]]; then
            up=1
          else
            up=0
          fi

          cat > "$METRICS_FILE" <<EOF
          springboot_up $up
          springboot_http_status_code $status
          EOF
      when: enable_node_exporter | default(false) | bool

    - name: Install local Spring Boot load generator script
      ansible.builtin.copy:
        dest: /usr/local/bin/springboot-loadgen.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          target="http://127.0.0.1:{{ springboot_app_port | default(8080) }}{{ springboot_loadgen_target_path | default('/') }}"
          metrics_dir="/var/lib/node_exporter/textfile_collector"
          metrics_file="$metrics_dir/springboot_loadgen.prom"
          state_file="$metrics_dir/springboot_loadgen_total.state"
          burst_min={{ springboot_loadgen_burst_min_requests | default(40) }}
          burst_max={{ springboot_loadgen_burst_max_requests | default(160) }}
          stress_enabled={{ springboot_loadgen_enable_stress | default(true) | bool | ternary('1', '0') }}
          stress_cpu_workers={{ springboot_loadgen_stress_cpu_workers | default(2) }}
          stress_vm_workers={{ springboot_loadgen_stress_vm_workers | default(1) }}
          stress_vm_bytes="{{ springboot_loadgen_stress_vm_bytes | default('40%') }}"
          stress_timeout_seconds={{ springboot_loadgen_stress_timeout_seconds | default(15) }}

          if (( burst_max < burst_min )); then
            burst_max=$burst_min
          fi

          if (( stress_cpu_workers < 1 )); then
            stress_cpu_workers=1
          fi

          if (( stress_vm_workers < 1 )); then
            stress_vm_workers=1
          fi

          if (( stress_timeout_seconds < 1 )); then
            stress_timeout_seconds=1
          fi

          mkdir -p "$metrics_dir"
          burst_count=$(( RANDOM % (burst_max - burst_min + 1) + burst_min ))
          success_count=0
          stress_applied=0

          previous_total=0
          if [[ -f "$state_file" ]]; then
            previous_total=$(cat "$state_file" 2>/dev/null || echo 0)
          fi

          if ! [[ "$previous_total" =~ ^[0-9]+$ ]]; then
            previous_total=0
          fi

          if (( stress_enabled == 1 )) && command -v stress-ng >/dev/null 2>&1; then
            stress_applied=1
            stress-ng \
              --cpu "$stress_cpu_workers" \
              --vm "$stress_vm_workers" \
              --vm-bytes "$stress_vm_bytes" \
              --timeout "${stress_timeout_seconds}s" \
              --metrics-brief >/dev/null 2>&1 &
            stress_pid=$!
          else
            stress_pid=""
          fi

          for _ in $(seq 1 "$burst_count"); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 3 "$target" || true)
            if [[ "$code" =~ ^[23] ]]; then
              success_count=$((success_count + 1))
            fi
            pause_ms=$(( RANDOM % 250 + 10 ))
            sleep "$(awk "BEGIN { printf \"%.3f\", $pause_ms / 1000 }")"
          done

          if [[ -n "$stress_pid" ]]; then
            wait "$stress_pid" || true
          fi

          total_requests=$((previous_total + burst_count))
          failed_count=$((burst_count - success_count))
          cat > "$state_file" <<EOF
          $total_requests
          EOF

          cat > "$metrics_file" <<EOF
          springboot_http_requests_total $total_requests
          springboot_http_requests_last_burst $burst_count
          springboot_http_requests_last_burst_success $success_count
          springboot_http_requests_last_burst_failed $failed_count
          springboot_loadgen_stress_enabled $stress_enabled
          springboot_loadgen_stress_applied $stress_applied
          springboot_loadgen_stress_cpu_workers $stress_cpu_workers
          springboot_loadgen_stress_vm_workers $stress_vm_workers
          springboot_loadgen_stress_timeout_seconds $stress_timeout_seconds
          EOF
      when: enable_local_load_generator | default(false) | bool

    - name: Install systemd unit for local Spring Boot load generator
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot-loadgen.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Generate local irregular HTTP load for Spring Boot demo service
          After=network-online.target springboot.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/springboot-loadgen.sh
      when: enable_local_load_generator | default(false) | bool

    - name: Install systemd timer for local Spring Boot load generator
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot-loadgen.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run local Spring Boot load generator with jitter

          [Timer]
          OnBootSec=45s
          OnUnitActiveSec={{ springboot_loadgen_base_interval_seconds | default(8) }}s
          RandomizedDelaySec={{ springboot_loadgen_randomized_delay_seconds | default(8) }}s
          Unit=springboot-loadgen.service

          [Install]
          WantedBy=timers.target
      when: enable_local_load_generator | default(false) | bool

    - name: Install systemd unit for Spring Boot health metric writer
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot-health-metrics.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Write Spring Boot health metrics for node exporter textfile collector
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/springboot-health-metrics.sh
      when: enable_node_exporter | default(false) | bool

    - name: Install systemd timer for Spring Boot health metric writer
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot-health-metrics.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run Spring Boot health metrics writer every 30 seconds

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          Unit=springboot-health-metrics.service

          [Install]
          WantedBy=timers.target
      when: enable_node_exporter | default(false) | bool

    - name: Ensure app group exists
      ansible.builtin.group:
        name: "{{ app_group }}"
        state: present

    - name: Ensure app user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Copy Spring Boot JAR
      ansible.builtin.copy:
        src: "{{ jar_local_path }}"
        dest: "{{ app_jar }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot.service
        mode: "0644"
        content: |
          [Unit]
          Description=Spring Boot Rehost Service
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -jar {{ app_jar }}
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter.service
        enabled: true
        state: restarted
      when: enable_node_exporter | default(false) | bool

    - name: Run Spring Boot health metrics writer once
      ansible.builtin.systemd:
        name: springboot-health-metrics.service
        state: started
      when: enable_node_exporter | default(false) | bool

    - name: Enable and start Spring Boot health metrics timer
      ansible.builtin.systemd:
        name: springboot-health-metrics.timer
        enabled: true
        state: started
      when: enable_node_exporter | default(false) | bool

    - name: Run local Spring Boot load generator once
      ansible.builtin.systemd:
        name: springboot-loadgen.service
        state: started
      when: enable_local_load_generator | default(false) | bool

    - name: Enable and start local Spring Boot load generator timer
      ansible.builtin.systemd:
        name: springboot-loadgen.timer
        enabled: true
        state: started
      when: enable_local_load_generator | default(false) | bool

    - name: Enable and start service
      ansible.builtin.systemd:
        name: springboot.service
        enabled: true
        state: started
